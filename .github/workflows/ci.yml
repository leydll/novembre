# intégration continue
name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend:
    defaults:
      runs-on:
        # toutes les commandes s'exécutent dans le dossier backend
        working-directory: backend

    steps:
      # récupérer le code source depuis le dépôt GitHub
      - uses: actions/checkout@v4
      
      # installer Node.js et configurer npm
      - uses: actions/setup-node@v4
        with:
          # version de Node.js à utiliser (22.x)
          node-version: '22'
          # activer le cache npm pour accélérer les installations 
          cache: 'npm'
          # chemin vers le fichier package-lock.json pour le cache
          cache-dependency-path: backend/package-lock.json

      # installer les dépendances 
      - run: npm install
      
      # ESLint : détecte les erreurs de syntaxe et les mauvaises pratiques
      - run: npm run lint
      
      # vérifier le formatage du code avec Prettier 
      - run: npm run prettier
      
      # exécuter les tests avec couverture de code <= 80% 
      - run: npm run test:coverage

  frontend:
    defaults runs-on:
      runs-on:
        # toutes les commandes s'exécutent dans le dossier frontend
        working-directory: frontend
    steps:
      # récupérer le code source depuis le dépôt GitHub
      - uses: actions/checkout@v4
      
      # installer Node.js et configurer npm
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # installer les dépendances 
      - run: npm install
      
      # vérifier le code avec ESLint 
      - run: npm run lint
      
      # vérifier le formatage du code avec Prettier 
      - run: npm run prettier
      
      # lancer le projet frontend 
      - run: npm run dev


